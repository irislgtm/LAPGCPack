        I:smallDataWireColouration=11784662

        # The maximum length of a single small data wire. Should not be much.
        I:smallDataWireLength=4

        # The RGB color of the small data wire.
        I:smallRedstoneWireColouration=16723759

        # The maximum length of a single small data wire. Should not be much.
        I:smallRedstoneWireLength=4

        # The RGB color of the data wire.
        I:tripwireColouration=9862765

        # The maximum length of the tripwire. Should be medium range at best.
        I:tripwireLength=8
    }

    ##########################################################################################################
    # vehicles
    #--------------------------------------------------------------------------------------------------------#
    # Customize II's vehicles, such as durability, speed, resource consumption and fire rate.
    ##########################################################################################################

    vehicles {
        # When enabled, clutch will not be engaged automatically during gear shift by its own.
        B:manualClutch=false

        # When disabled, gearbox will shift gears automatically based on speed.
        B:manualGearbox=true

        ##########################################################################################################
        # motorbike
        #--------------------------------------------------------------------------------------------------------#
        # Config for the motorbike, allows for changes in durability, fuel usage and capacity
        ##########################################################################################################

        motorbike {
            # Damage resistance of the engine.
            I:engineDurability=100

            # Amount of fuel burn per time, dependent on diesel generator fluids (in mB)
            I:fuelBurnAmount=8

            # Fuel capacity of the motorbike.
            I:fuelCapacity=12000

            # Damage resistance of the fuel tank.
            I:fuelTankDurability=80

            # Fuel usage per one meter driven.
            I:fuelUsage=6

            # Damage resistance of the wheels.
            I:wheelDurability=40
        }

        ##########################################################################################################
        # fieldhowitzer
        #--------------------------------------------------------------------------------------------------------#
        # Config for the Field Howitzer, allows for changes to durability and fire rate
        ##########################################################################################################

        fieldhowitzer {
            # Time required to fire a single shell using the field howitzer.
            I:fireTime=50

            # Damage resistance of the gun barrel.
            I:gunDurability=80

            # Damage resistance of the gun frame.
            I:mainDurability=160

            # Time required to reload a field howitzer.
            I:reloadTime=80

            # Time required to set up field howitzer after moving it.
            I:setupTime=15

            # Damage resistance of the gun shield (both sides have common health).
            I:shieldDurability=160

            # Time required to tow a field howitzer.
            I:towingTime=80

            # Damage resistance of the wheels.
            I:wheelDurability=40
        }

    }

    ##########################################################################################################
    # factions
    #--------------------------------------------------------------------------------------------------------#
    # Customize II's multiplayer factions and property ownership system.
    ##########################################################################################################

    factions {
        # Determines how often faction property-bound chunkloader tickets are checked for validity. (in ticks)
        I:chunkloaderTickDelay=200

        # Determines how often properties try to claim surrounding chunks. (in ticks)
        I:claimTickDelay=200

        # Allows to disable II's faction system completely. Chunk claiming, ownership and commanding Hanses will not work when disabled.
        B:enableFactions=true

        # When enabled, players not belonging to a faction cannot access containers on chunks belonging to other factions.
        B:preventContainerAccess=true
    }

    ##########################################################################################################
    # compat
    #--------------------------------------------------------------------------------------------------------#
    # A list of all mods that II has integrated compatability for
    # Setting any of these to false disables the respective compat
    ##########################################################################################################

    compat {
        B:baubles=true
        B:betterwithmods=true
        B:cfb=true
        B:computercraft=true
        B:deeperdepths=true
        B:fluidlogged_api=true
        B:immersive_energy=true
        B:immersiveengineering=true
        B:immersivepetroleum=true
        B:immersiveposts=true
        B:immersivetech=true
        B:mysticalmechanics=true
        B:nb=true
        B:opencomputers=true
        B:tfc=true
        B:thaumcraft=true
        B:thaumicaugmentation=true
        B:toughasnails=true
    }

}


