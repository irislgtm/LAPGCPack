    ##########################################################################################################
    # mechanicaldevices
    #--------------------------------------------------------------------------------------------------------#
    # Customize II Mechanical devices, such as torque, speed and conversion ratios.
    ##########################################################################################################

    mechanicaldevices {
        # Max length of the belt, works exactly like wires (measured in blocks).
        # Belts: Cloth, Steel, Rubber
        I:beltLength <
            8
            16
            16
         >

        # Belts will break if Torque is higher than this value.
        # Belts: Cloth, Steel, Rubber
        I:beltMaxTorque <
            50
            200
            100
         >

        # Torque loss, later multiplied by belt length.
        # Belts: Cloth, Steel, Rubber
        D:beltTorqueLoss <
            0.05000000074505806
            0.10000000149011612
            0.009999999776482582
         >

        # Torque multiplier for the axle from MysticalMechanics.
        D:dynamoBWMAxleTorque=18.0

        # Default torque, used as a fallback, when IE rotational device is not recognised.
        D:dynamoDefaultTorque=16.0

        # Torque multiplier for the axle from MysticalMechanics.
        D:dynamoMMAxleTorque=18.0

        # Torque multiplier for the windmill.
        D:dynamoWatermillTorque=24.0

        # Torque multiplier for the windmill.
        D:dynamoWindmillTorque=20.0

        # The modifier of internal torque of a machine using this gear.
        # Gears: Copper, Brass, Iron, Steel, Tungsten
        D:gearTorqueModifier <
            0.25
            0.5
            1.0
            2.0
            4.0
         >

        # Immersive Flux to Rotary Flux conversion ratio (default 4 RoF = 1 IF).
        D:rofConversionRatio=4.0
    }

    ##########################################################################################################
    # tools
    #--------------------------------------------------------------------------------------------------------#
    # Customize II handheld tools, such as energy capacity, usage and durability.
    ##########################################################################################################

    tools {
        # The energy capacity of advanced binoculars (when using Infrared Sight).
        I:advancedBinocularsEnergyCapacity=4000

